[package]
name = "gpslog-geotag"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Safe GPSLog track matching and Nikon NEF geotagging workflow"

[[bin]]
name = "gpslog-geotag"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
dunce = "1.0"
hex = "0.4"
html-escape = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3.20"
uuid = { version = "1.17", features = ["v4"] }
walkdir = "2.5"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
